<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Камень-Ножницы-Бумага со статистикой</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Камень-Ножницы-Бумага</h1>
        <p>Выберите свой ход. Каждое нажатие начинает новый раунд.</p>
        <div class="buttons">
            <button onclick="play('Камень')">Камень</button>
            <button onclick="play('Ножницы')">Ножницы</button>
            <button onclick="play('Бумага')">Бумага</button>
        </div>
        <div aria-live="polite">
            <p>Ваш выбор: <span id="playerChoice">—</span></p>
            <p>Выбор компьютера: <span id="computerChoice">—</span></p>
            <p id="result">Сделайте первый ход.</p>
        </div>
        <h2>Статистика</h2>
        <p>Победы: <span id="wins">0</span></p>
        <p>Победы компьютера: <span id="losses">0</span></p>
        <p>Ничьи: <span id="draws">0</span></p>
        <p>Всего раундов: <span id="rounds">0</span></p>
        <p>Процент побед: <span id="winRate">0%</span></p>

    </div>
    <script src="script.js"></script>
</body>
</html>
